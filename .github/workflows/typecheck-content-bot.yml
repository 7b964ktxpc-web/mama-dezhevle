name: content-bot-typecheck

on:
  pull_request:
    paths:
      - "src/lib/content-*.ts"
      - "src/lib/supabase-admin.ts"
      - "src/jobs/content-bot.ts"
      - "src/app/api/content-bot/**"
      - "supabase/migrations/*content_bot.sql"
      - "package.json"
      - "tsconfig.json"
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm install --no-package-lock
      - run: npm run typecheck
