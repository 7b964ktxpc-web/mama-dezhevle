name: deals-pipeline

on:
  workflow_dispatch:
    inputs:
      preview_only:
        description: "Только показать посты, без публикации в Telegram"
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "17 */3 * * *"

env:
  PREVIEW_ONLY: ${{ github.event_name == 'schedule' && 'true' || inputs.preview_only }}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm install --no-package-lock
      - run: npm run build
      - run: npm run collect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  publish:
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm install --no-package-lock
      - run: npm run publish
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          PREVIEW_ONLY: ${{ env.PREVIEW_ONLY }}
