name: deals-pipeline

on:
  workflow_dispatch:
    inputs:
      preview_only:
        description: "Только показать посты, без публикации в Telegram"
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "17 */3 * * *"

env:
  PREVIEW_ONLY: ${{ github.event_name == 'schedule' && 'true' || inputs.preview_only }}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm install --no-package-lock
      - run: npm run typecheck
      - run: npm run build
      - name: Validate catalog source configuration
        env:
          CATALOG_YML_URL: ${{ secrets.CATALOG_YML_URL }}
          CATALOG_YML_URLS: ${{ secrets.CATALOG_YML_URLS }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_BUSINESS_ID: ${{ secrets.YANDEX_MARKET_BUSINESS_ID }}
        run: |
          if [ -z "$CATALOG_YML_URL" ] && [ -z "$CATALOG_YML_URLS" ] && { [ -z "$YANDEX_MARKET_API_KEY" ] || [ -z "$YANDEX_MARKET_BUSINESS_ID" ]; }; then
            echo "ERROR: configure either CATALOG_YML_URL(S) or both YANDEX_MARKET_API_KEY and YANDEX_MARKET_BUSINESS_ID"
            exit 1
          fi
          [ -n "$CATALOG_YML_URL" ] && echo "CATALOG_YML_URL is configured"
          [ -n "$CATALOG_YML_URLS" ] && echo "CATALOG_YML_URLS is configured"
          if [ -n "$YANDEX_MARKET_API_KEY" ] && [ -n "$YANDEX_MARKET_BUSINESS_ID" ]; then
            echo "Yandex Market API source is configured"
          fi
      - run: npm run collect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CATALOG_YML_URL: ${{ secrets.CATALOG_YML_URL }}
          CATALOG_YML_URLS: ${{ secrets.CATALOG_YML_URLS }}
          CATALOG_YML_SOURCE: ${{ vars.CATALOG_YML_SOURCE }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_BUSINESS_ID: ${{ secrets.YANDEX_MARKET_BUSINESS_ID }}
          DETMIR_FIXTURE_ENABLED: "false"

  publish:
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm install --no-package-lock
      - run: npm run publish
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          PREVIEW_ONLY: ${{ env.PREVIEW_ONLY }}
