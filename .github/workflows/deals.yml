name: deals-pipeline

on:
  workflow_dispatch:
    inputs:
      preview_only:
        description: "Только показать посты, без публикации в Telegram"
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: read

env:
  PREVIEW_ONLY: ${{ github.event_name == 'schedule' && 'true' || inputs.preview_only }}

concurrency:
  group: mama-dezhevle-deals
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm install --no-package-lock
      - run: npm run typecheck
      - run: npm run build
      - run: npm run collect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SIMA_LAND_API_KEY: ${{ secrets.SIMA_LAND_API_KEY }}
          SIMA_LAND_PAGES: ${{ vars.SIMA_LAND_PAGES }}
          SIMA_LAND_ITEM_IDS: ${{ vars.SIMA_LAND_ITEM_IDS }}
          SIMA_LAND_BABY_ONLY: ${{ vars.SIMA_LAND_BABY_ONLY }}
          CATALOG_YML_URL: ${{ secrets.CATALOG_YML_URL }}
          CATALOG_YML_URLS: ${{ secrets.CATALOG_YML_URLS }}
          CATALOG_YML_SOURCE: ${{ vars.CATALOG_YML_SOURCE }}
          DETMIR_PUBLIC_ENABLED: "true"
          DETMIR_FIXTURE_ENABLED: "false"

  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm install --no-package-lock
      - run: npm run publish
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          PREVIEW_ONLY: ${{ env.PREVIEW_ONLY }}
